# golangci-lint configuration for SchemaHub backend
# https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - misspell
    - staticcheck
    - unused
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G404 # weak random number generator (fine for non-security contexts)
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/schemahub/backend

run:
  timeout: 5m
