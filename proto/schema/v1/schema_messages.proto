syntax = "proto3";
package schemahub.schema.v1;
option go_package = "github.com/schemahub/backend/proto/schema/v1;schemav1";


message Schema {
  string id = 1;
  string project_id = 2;
  string connection_id = 3;
  string schema_name = 4;
  string current_version_id = 5;
  string last_introspected_at = 6;
  string created_at = 7;
  string updated_at = 8;
}

message SchemaVersion {
  string id = 1;
  string schema_id = 2;
  int32 version = 3;
  string checksum = 4;
  int32 object_count = 5;
  string parent_version_id = 6;
  string created_by = 7;
  string created_at = 8;
}

message SchemaObject {
  string id = 1;
  string schema_version_id = 2;
  string object_type = 3;
  string object_name = 4;
  string object_schema = 5;
  string definition = 6;
  string parent_object_id = 7;
}

message DiagramNode {
  string id = 1;
  string type = 2;
  DiagramPosition position = 3;
  DiagramNodeData data = 4;
}

message DiagramNodeData {
  string label = 1;
  repeated ColumnInfo columns = 2;
  string object_type = 3;
}

message ColumnInfo {
  string name = 1;
  string type = 2;
  bool nullable = 3;
  string default = 4;
  bool is_pk = 5;
  bool is_fk = 6;
}

message DiagramPosition {
  double x = 1;
  double y = 2;
}

message DiagramEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string source_handle = 4;
  string target_handle = 5;
  string label = 6;
}

message IntrospectSchemaRequest {
  string connection_id = 1;
  repeated string schema_names = 2;
}

message IntrospectSchemaResponse {
  Schema schema = 1;
  SchemaVersion schema_version = 2;
}

message GetSchemaRequest {
  string id = 1;
}

message GetSchemaResponse {
  Schema schema = 1;
}

message ListSchemasRequest {
  string project_id = 1;
  string cursor = 2;
  int32 page_size = 3;
}

message ListSchemasResponse {
  repeated Schema schemas = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message ListSchemaVersionsRequest {
  string schema_id = 1;
  string cursor = 2;
  int32 page_size = 3;
}

message ListSchemaVersionsResponse {
  repeated SchemaVersion versions = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message GetSchemaVersionRequest {
  string id = 1;
}

message GetSchemaVersionResponse {
  SchemaVersion version = 1;
}

message CompareSchemaVersionsRequest {
  string version_a_id = 1;
  string version_b_id = 2;
}

message CompareSchemaVersionsResponse {
  SchemaDiff diff = 1;
}

message SchemaDiff {
  repeated DiffObject added_objects = 1;
  repeated DiffObject removed_objects = 2;
  repeated DiffObject modified_objects = 3;
}

message DiffObject {
  string type = 1;
  string name = 2;
  string definition = 3;
  repeated FieldChange changes = 4;
}

message FieldChange {
  string field = 1;
  string before = 2;
  string after = 3;
}

message ListSchemaObjectsRequest {
  string schema_version_id = 1;
  string object_type = 2;
  string cursor = 3;
  int32 page_size = 4;
}

message ListSchemaObjectsResponse {
  repeated SchemaObject objects = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message GetSchemaDiagramRequest {
  string schema_version_id = 1;
  bool include_details = 2;
}

message GetSchemaDiagramResponse {
  repeated DiagramNode nodes = 1;
  repeated DiagramEdge edges = 2;
}