version: v1
managed:
  enabled: false
plugins:
  - plugin: go
    out: ../backend/proto
    opt: paths=source_relative
  - plugin: go-grpc
    out: ../backend/proto
    opt: paths=source_relative
  - plugin: es
    out: ../frontend/src/lib/gen
    opt:
      - target=ts
      - import_extension=none
