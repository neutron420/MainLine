syntax = "proto3";
package schemahub.common.v1;
option go_package = "github.com/schemahub/backend/proto/common/v1;commonv1";

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string avatar_url = 4;
  string role = 5;
  bool is_active = 6;
  string created_at = 7;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  map<string, string> field_errors = 3;
  string request_id = 4;
}
