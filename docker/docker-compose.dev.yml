services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    ports:
      - "50051:50051"
      - "9091:9091"
      - "2345:2345" # Delve debugger
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
    volumes:
      - ../backend:/app
      - gomod:/go/pkg/mod

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - SCHEMAHUB_ENV=development
      - NODE_ENV=development
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: schemahub
      POSTGRES_PASSWORD: schemahub
      POSTGRES_DB: schemahub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemahub -d schemahub"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  envoy:
    image: envoyproxy/envoy:v1.28-latest
    ports:
      - "9901:9901"
      - "8080:8080"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - backend

volumes:
  gomod:
  node_modules:
  pgdata:
