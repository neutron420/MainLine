name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  typescript:
    name: TypeScript ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend exists
        id: check-frontend
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check-frontend.outputs.exists == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.check-frontend.outputs.exists == 'true'
        run: npm run lint

      - name: Type check
        if: steps.check-frontend.outputs.exists == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.check-frontend.outputs.exists == 'true'
        run: npm run test

  backend:
    name: Backend build, vet, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5455/schemahub_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: schemahub_test
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Coverage gate
        working-directory: backend
        run: |
          go test ./internal/... ./pkg/... -coverprofile=coverage-unit.out
          go test ./internal/integration/... -coverpkg=github.com/schemahub/backend/internal/... -coverprofile=coverage-integration.out
          head -n 1 coverage-unit.out > coverage.out
          tail -n +2 coverage-unit.out >> coverage.out
          tail -n +2 coverage-integration.out >> coverage.out
          total=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: $total%"
          if awk "BEGIN { exit !($total >= 50) }"; then
            echo "✅ Coverage gate passed ($total% >= 50%)"
          else
            echo "❌ Coverage gate failed ($total% < 50%)"
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker/docker-compose.yml build backend