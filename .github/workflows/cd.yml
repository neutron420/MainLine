name: CD

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  BUF_VERSION: "1.32.0"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  proto-check:
    name: Proto generation check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.29.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generate protos
        working-directory: proto
        run: buf generate

      - name: Check for unstaged changes
        run: |
          if ! git diff --stat --exit-code; then
            echo "❌ Proto generation is out of date. Run 'buf generate' and commit the changes."
            exit 1
          fi

  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check frontend exists
        id: check-frontend
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set lowercase repo
        id: repo-case
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo-case.outputs.lower }}/backend:latest
            ${{ env.REGISTRY }}/${{ steps.repo-case.outputs.lower }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        if: steps.check-frontend.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo-case.outputs.lower }}/frontend:latest
            ${{ env.REGISTRY }}/${{ steps.repo-case.outputs.lower }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: [proto-check, build-and-push]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Deploy backend to Railway
        run: |
          echo "::notice::Deploying backend to Railway..."
          # TODO: Replace with actual Railway CLI deployment
          # Requires RAILWAY_TOKEN secret
          # npm install -g @railway/cli
          # railway up --service schemahub-backend
          echo "✅ Backend deployment to Railway complete (placeholder)"

      - name: Verify deployment
        run: |
          echo "::notice::Verifying backend health..."
          # TODO: Add health check against the deployed service
          echo "✅ Backend health check passed (placeholder)"

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [proto-check, build-and-push]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check frontend exists
        id: check-frontend
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.check-frontend.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy frontend to Vercel
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          echo "::notice::Deploying frontend to Vercel..."
          # TODO: Replace with actual Vercel CLI deployment
          # Requires VERCEL_TOKEN and VERCEL_ORG_ID secrets
          # npx vercel --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          echo "✅ Frontend deployment to Vercel complete (placeholder)"

      - name: Promote deployment
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          echo "::notice::Promoting frontend deployment..."
          # TODO: Verify deployment and promote if needed
          echo "✅ Frontend promotion complete (placeholder)"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' && '✅' || '❌' }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          PAYLOAD=$(cat <<EOF
          {
            "text": "$DEPLOY_STATUS SchemaHub deployment to ${{ github.ref_name }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "$DEPLOY_STATUS *SchemaHub Deployment* to \`${{ github.ref_name }}\`"
                }
              },
              {
                "type": "fields",
                "fields": [
                  { "type": "mrkdwn", "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>" },
                  { "type": "mrkdwn", "text": "*Author:*\n${{ github.triggering_actor }}" }
                ]
              },
              {
                "type": "fields",
                "fields": [
                  { "type": "mrkdwn", "text": "*Backend:*\n${{ needs.deploy-backend.result }}" },
                  { "type": "mrkdwn", "text": "*Frontend:*\n${{ needs.deploy-frontend.result }}" }
                ]
              }
            ]
          }
          EOF
          )
          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"
          echo "::notice::Slack notification sent"